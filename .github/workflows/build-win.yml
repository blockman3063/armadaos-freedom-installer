name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      checkout_repo:
        description: "Repository to checkout"
        required: false
        default: "ArmadaOS-Freedom/armadaos-freedom-installer"
      checkout_ref:
        description: "Ref (branch/sha/PR)"
        required: false
        default: "main"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.checkout_repo }}
          ref: ${{ github.event.inputs.checkout_ref }}
          persist-credentials: false
      - name: Build (Docker)
        run: |
          docker build -f tools/installer-builder.Dockerfile -t armada-installer-builder tools
          docker run --rm -v "${{ github.workspace }}:/src" -v "${{ github.workspace }}/artifacts:/work" armada-installer-builder python3 -B maintenance/build_installer.py --work-dir /work/build --output-dir /work/publish
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FreedomInstaller-win-x64
          path: artifacts/publish/
      - name: Upload build record
        uses: actions/upload-artifact@v4
        with:
          name: build-record
          path: artifacts/build/build-record.json
          if-no-files-found: ignore
